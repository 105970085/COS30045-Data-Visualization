<svg xmlns="http://www.w3.org/2000/svg"
     width="450"
     height="300"
     viewBox="0 0 450 300">

  <style>
    .wall {
      fill: #f4c2a1;
      stroke: #5b4636;
      stroke-width: 2;
    }

    .roof {
      fill: #9b4d3a;
      stroke: #5b4636;
      stroke-width: 2;
    }

    .window {
      fill: #bfe3f2;
      stroke: #315b6b;
      stroke-width: 2;
    }

    .grass {
      fill: #9bcf7b;
    }
  </style>

  <!-- Garden -->
  <rect class="grass"
        x="0" y="215"
        width="450" height="85"/>

  <!-- Sun -->
  <circle cx="380" cy="45" r="23"
          fill="#ffd65a"/>

  <!-- House -->
  <g id="house">

    <!-- Wall -->
    <rect class="wall"
          x="140" y="125"
          width="170" height="105"/>

    <!-- Roof -->
    <path class="roof"
          d="M120 125 L225 45 L330 125 Z"/>

    <!-- Door -->
    <rect x="205" y="175"
          width="35" height="55"
          fill="#7b4f36"/>

    <!-- Door handle -->
    <circle cx="232" cy="203"
            r="3"
            fill="#ffd65a"/>

    <!-- Windows -->
    <rect class="window"
          x="160" y="150"
          width="35" height="30"/>

    <rect class="window"
          x="255" y="150"
          width="35" height="30"/>

    <!-- Window lines -->
    <line x1="177" y1="150"
          x2="177" y2="180"
          stroke="#315b6b"/>

    <line x1="160" y1="165"
          x2="195" y2="165"
          stroke="#315b6b"/>

  </g>

  <!-- Tree -->
  <rect x="70" y="190"
          width="10" height="45"
          fill="#76502f"/>
          
  <ellipse cx="75" cy="185"
             rx="35" ry="30"
             fill="#5d9b55"/>

  <!-- Garden path -->
  <path d="M222 230 L222 300"
        stroke="#d9c2a0"
        stroke-width="20"
        fill="none"/>

  <!-- Title -->
  <text x="225" y="290"
        text-anchor="middle"
        font-size="14"
        font-family="Arial">
    My House
  </text>

</svg>


<img src="img/circle,rect,line.png" alt="annotate an example of circle, rect, line">

<img src="img/path,ellipse.png" alt="annotate an example of path, ellipse">
